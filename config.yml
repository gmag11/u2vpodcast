production: true
title: u2vpodcast
url: localhost
port: 6996
sleep_time: 1
per_page: 3
# Session signing key. MUST be exactly 64 characters (64 bytes); a shorter
# value makes the server panic at startup (the cookie crate Key::from requires
# 64 bytes). Generate a new random value for each deployment, e.g. with:
#   openssl rand -base64 48 | tr -d '\n'
secret_key: "Idz6CvGkPzEEbvwzNwp6adGodfjBPoRVUdIz5QVOyoi1Llff9o3Fz7NEScsh6tAH"
# If both admin_username and admin_password are present, the admin user is
# recreated from these values on every startup. To instead use the admin
# account already stored in the database, comment out both keys below; the
# users table is then left untouched.
admin_username: admin
admin_password: nimda
# When true, the RSS feed (/channels/{channel_id}/feed.xml) and the media files
# (/media/**) require HTTP Basic Auth using the admin credentials above.
# When false, they are served without authentication. Defaults to true if omitted.
with_authentication: true
