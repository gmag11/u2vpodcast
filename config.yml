production: true
title: u2vpodcast
# Public origin of this deployment, used for the production CORS allowlist.
# Must be a full origin without trailing slash or path, e.g. https://podcasts.example.com
# (the origin shown in the browser's address bar). If this app is served behind
# a reverse proxy on the same host as the SPA, requests are same-origin and CORS
# does not affect them either way.
url: http://localhost:6996
port: 6996
sleep_time: 4
per_page: 10
# Session signing key. MUST be exactly 64 characters (64 bytes); a shorter
# value makes the server panic at startup (the cookie crate Key::from requires
# 64 bytes).
#
# IMPORTANT: this is a PLACEHOLDER for the example config. Replace it with a
# fresh random value for EACH deployment BEFORE going live, e.g. with:
#   openssl rand -base64 48 | tr -d '\n'
# If you reuse this placeholder value, anyone who knows this repository can
# forge valid session cookies and take over the deployment.
secret_key: "REPLACE_THIS_WITH_YOUR_OWN_RANDOM_64_BYTE_SECRET_KEY_1234567890_"
# If both admin_username and admin_password are present, the admin user is
# recreated from these values on every startup. Because recreation produces a
# new row id, existing login sessions DO NOT survive container restarts. To
# keep sessions across restarts: log in once with these credentials so the
# user row exists, then comment out both keys below. The users table is then
# left untouched and sessions persist.
admin_username: admin
admin_password: nimda
# When true, the RSS feed (/channels/{channel_id}/feed.xml) and the media files
# (/media/**) require HTTP Basic Auth using the admin credentials above.
# When false, they are served without authentication. Defaults to true if omitted.
with_authentication: true
# Log level for the application. One of: TRACE, DEBUG, INFO, WARN, ERROR.
# Defaults to INFO if omitted. The RUST_LOG environment variable, when set,
# takes precedence over this value.
log_level: INFO

# SponsorBlock is fully opt-in. When false (the default), the application makes
# no SponsorBlock requests, performs no reconciliation or media processing,
# exposes no SponsorBlock data or refresh action, skips no playback intervals,
# renders no markers, and always selects original media in feeds. Existing
# installations that want the previous behavior must set this to true.
sponsorblock_enabled: false
# Categories removed from derived feed audio and skipped by the web player when
# SponsorBlock is enabled. Defaults to [sponsor] when omitted. Supported values:
# sponsor, selfpromo, interaction, intro, outro, preview, music_offtopic, filler.
# Use [] to reject nothing while still displaying every supported category as a
# timeline marker. Changes are loaded on restart; API policy updates immediately,
# while derived media is updated by the next synchronization or manual refresh.
sponsorblock_rejected_categories:
  - sponsor
  - selfpromo
  - interaction
  - intro
  - outro
  - preview
  - music_offtopic
  - filler
