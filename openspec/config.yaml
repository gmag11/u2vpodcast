schema: spec-driven

context: |
  Tech stack: Rust (actix-web 4, actix-session, sqlx/sqlite, argon2), SvelteKit frontend served as static files.
  IMPORTANT: Generate ALL artifact content (proposal, design, specs, tasks) in English.
  IMPORTANT: When bumping the application version, update the `version` field in `Cargo.toml` (Rust crate), the `version` field in `frontend/package.json` (SPA), and the image tag `vX.Y.Z` in `docker-bake.hcl`. These three must stay in sync; the release tag follows the same `vX.Y.Z` pattern.
  IMPORTANT: Always create a new branch for a new proposal; never work on the default branch.
githubCopilot:
  cloudAgent: false

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
